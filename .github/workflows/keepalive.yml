name: Keep-alive

# Supabase Free pauses a project after a week without activity. One small
# authenticated request a day keeps it awake (NFR-4). Scheduled workflows run
# only from the default branch (main).
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, 06:17 in Kigali
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the keep-alive route
        # Secrets go through env, never inline in the script.
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # --fail-with-body exits non-zero on any HTTP error, so GitHub emails Favour.
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$KEEPALIVE_URL"
