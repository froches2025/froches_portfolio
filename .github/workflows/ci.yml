name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret: the canonical URL for builds and tests on the runner.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      # Runtime dependencies only: dev-only findings (such as @lhci/cli's) are reported by npm, not blocking.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  commitlint:
    name: commitlint
    # Commit range and PR title only exist on pull requests; a skipped job counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint the PR's commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint the PR title (it becomes the squash commit)
        # Passed through env, never inlined, so a crafted title cannot inject shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          # .next is a hidden folder, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          path: |
            .next/
            !.next/cache/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - run: npm run lighthouse
      - name: Report scores
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      # Uploaded on every run, so passing scores can be compared over time too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          include-hidden-files: true
          path: .lighthouseci/
          retention-days: 14
