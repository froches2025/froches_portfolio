name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not secrets: public values for builds and tests on the runner. No page reads
  # the database yet, so the Supabase values only need to pass validation.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
      # Runtime dependencies only: dev-only findings (such as @lhci/cli's) are reported by npm, not blocking.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  commitlint:
    name: commitlint
    # Commit range and PR title only exist on pull requests; a skipped job counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint the PR's commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint the PR title (it becomes the squash commit)
        # Passed through env, never inlined, so a crafted title cannot inject shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Starts Postgres with auth and storage (their schemas are under test),
      # applies every migration and loads the seed.
      - run: npx supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Pages are prerendered from the database, so the build reads a fresh,
      # seeded local Supabase (Kong and PostgREST serve the API it calls).
      - run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Use the local publishable key
        run: echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o json | jq -r .PUBLISHABLE_KEY)" >> "$GITHUB_ENV"
      # prebuild writes the case-study slug allowlist from the same database.
      - run: npm run build
      - if: always()
        run: npx supabase stop --no-backup
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      # Every page, case study and share image must be prerendered, so no
      # public route queries Supabase at request time (NFR-4, FR-10).
      - run: node scripts/check-prerendered.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          # .next is a hidden folder, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          path: |
            .next/
            !.next/cache/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - name: Start the server and warm it up
        run: |
          npm run start > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          # One request per audited URL, so no run measures a cold first request.
          for path in / /projects/aidready /about; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done
      - run: npm run lighthouse
      - name: Report scores
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      # Uploaded on every run, so passing scores can be compared over time too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          include-hidden-files: true
          path: .lighthouseci/
          retention-days: 14
